<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>돈영이 키우기</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9d3c6;--card:#ece7dc;--ink:#2a2622;--sub:#6b6258;--hat:#e8b923;--rust:#a8512a;--line:#b8b0a0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#26221e;--card:#332e29;--ink:#eee7da;--sub:#a39a8d;--rust:#d9774a;--line:#4a423b;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans KR",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1,.money,.own{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400}
h1{font-size:28px;margin:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rank{color:var(--sub);font-size:13px;text-align:right}
.money{font-size:40px;margin:8px 0 0}
.rate{color:var(--sub);margin:0 0 10px;font-size:14px}
#fx{display:none;margin-bottom:10px;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:700;justify-content:space-between;align-items:center;gap:8px}
#fx.bad{background:var(--rust);color:#fff}#fx.good{background:var(--hat);color:#2a2622}
#fx button{border:0;border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer}
#stage{position:relative;display:flex;align-items:flex-end;justify-content:space-around;width:100%;height:190px;overflow:hidden;border:0;border-radius:12px;background:linear-gradient(var(--card),var(--line));cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
#stage small{position:absolute;left:12px;top:8px;color:var(--sub);font-size:13px}
#miner{font-size:64px;line-height:1;transform-origin:50% 100%;margin-bottom:14px}
#miner.swing{animation:swing .18s}
@keyframes swing{0%{transform:rotate(0)}40%{transform:rotate(-18deg) translateX(10px)}100%{transform:rotate(0)}}
#rock{width:130px;height:100px;margin-bottom:12px;border-radius:42% 58% 46% 54%/55% 45% 55% 45%;background:var(--oc,#3a3633);box-shadow:inset -12px -10px 0 rgba(0,0,0,.25),inset 8px 8px 0 rgba(255,255,255,.18);transition:background .3s}
#rock.hit{animation:hit .14s}
@keyframes hit{50%{transform:scale(.9,.92) rotate(-3deg)}}
.p{position:absolute;width:8px;height:8px;border-radius:2px;pointer-events:none}
.f{position:absolute;pointer-events:none;font:700 18px "Noto Sans KR",sans-serif;color:var(--ink)}
.layers{display:flex;gap:6px;margin:10px 0;overflow-x:auto;padding-bottom:4px}
.layers button{flex:0 0 auto;min-width:84px;padding:6px 8px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;text-align:center}
.layers button.on{border-color:var(--rust);box-shadow:0 2px 0 var(--rust)}
.layers button:disabled{opacity:.5;cursor:not-allowed}
.layers i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
#boss{min-height:46px;margin:10px 0;padding:10px 12px;border-left:4px solid var(--rust);background:var(--card);font-size:14px}
h2{font-size:16px;margin:20px 0 8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.item:disabled{opacity:.45;cursor:not-allowed}
.item:not(:disabled):hover{border-color:var(--rust)}
.item b{display:block}.item span{font-size:13px;color:var(--sub)}
.own{font-size:22px;min-width:32px;text-align:right}
.cost{white-space:nowrap;font-weight:700;font-size:14px;text-align:right}
#quit{border-color:var(--rust)}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ach div{padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:12px;opacity:.45}
.ach div.done{opacity:1;background:var(--card);border-color:var(--hat)}
.ach b{display:block;font-size:13px}
.foot{display:flex;gap:8px;margin-top:20px}
.foot button{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--sub);font:inherit;font-size:13px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:var(--hat);color:#2a2622;padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;transition:.25s;pointer-events:none;max-width:90%}
#toast.show{transform:translate(-50%,0);opacity:1}
:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#miner.swing,#rock.hit{animation:none}}
:root{--ol:#1a1714}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ol:#eee7da}}
body{background-image:radial-gradient(rgba(0,0,0,.09) 1.3px,transparent 1.7px);background-size:12px 12px}
h1{color:var(--hat);-webkit-text-stroke:3px var(--ol);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ol);transform:rotate(-2deg);font-size:30px}
.money{display:inline-block;background:#fff;color:#1a1714;border:3px solid var(--ol);box-shadow:4px 4px 0 var(--ol);padding:0 14px;border-radius:12px;transform:rotate(-1deg)}
.item,.layers button{border:3px solid var(--ol);box-shadow:3px 3px 0 var(--ol)}
.item:not(:disabled):active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ol)}
.layers button.on{background:var(--hat);color:#1a1714;border-color:var(--ol)}
#boss{border:3px solid var(--ol);border-radius:14px;box-shadow:3px 3px 0 var(--ol)}
#boss::before{content:"😠 "}
#fx{border:3px solid var(--ol);box-shadow:3px 3px 0 var(--ol)}
#fx.bad{animation:shk .35s infinite}
@keyframes shk{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.ach div.done{border:3px solid var(--ol);box-shadow:2px 2px 0 var(--ol)}
#toast{border:3px solid var(--ol)}
#stage{border:4px solid var(--ol);box-shadow:5px 5px 0 var(--ol);background:linear-gradient(transparent 84%,#6b4a2f 84%,#6b4a2f 86%,#4d3420 86%),radial-gradient(rgba(0,0,0,.14) 1.5px,transparent 2px) 0 0/10px 10px,var(--card)}
#stage small{background:var(--card);padding:0 6px;border-radius:6px;color:var(--ink)}
#miner.swing{animation:none}
#miner{margin-bottom:6px}
#arm{transform-origin:76px 96px}
#miner.swing #arm{animation:arm .2s}
@keyframes arm{0%{transform:rotate(0)}35%{transform:rotate(-55deg)}70%{transform:rotate(25deg)}100%{transform:rotate(0)}}
#rock{width:140px;height:121px;border-radius:0;background:none;box-shadow:none;margin-bottom:6px}
.eye{transform-box:fill-box;transform-origin:center}
#rock.hit .eye{animation:sq .25s}
@keyframes sq{30%{transform:scaleY(.1)}}
.ey{transform-box:fill-box;transform-origin:center}
#stage.bad .ey{transform:scaleY(.3)}
#stage .m2,#stage .sw{display:none}
#stage.bad .m2,#stage.bad .sw{display:block}
#stage.bad .m1{display:none}
#stage.bad .sw{animation:bob .4s infinite alternate}
#bub{position:absolute;left:8px;top:30px;max-width:46%;padding:6px 10px;background:#fff;color:#1a1714;border:3px solid #1a1714;border-radius:14px;font:700 13px "Noto Sans KR",sans-serif;text-align:left;z-index:2}
#bub::after{content:"";position:absolute;left:34px;bottom:-12px;border:8px solid transparent;border-top:10px solid #1a1714;border-bottom:0}
.pow{position:absolute;pointer-events:none;font:30px "Black Han Sans",sans-serif;color:#ffe14d;-webkit-text-stroke:6px #1a1714;paint-order:stroke fill;z-index:3;white-space:nowrap}
#crew{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end;min-height:38px;margin-top:10px;padding:4px 8px;border:3px dashed var(--line);border-radius:10px;font-size:22px}
#crew span{display:inline-block;animation:bob .7s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px) rotate(8deg)}}
#crew em{font-size:13px;color:var(--sub);font-style:normal}
@media (prefers-reduced-motion:reduce){#crew span,#fx.bad,#stage.bad .sw,#miner.swing #arm,#rock.hit .eye{animation:none}}
:root:root:root{--bg:#1b1713;--card:#2a241e;--ink:#f1e8d8;--sub:#a89c8a;--line:#5a4d3e;--ol:#0b0907;--gold:#c9a24b;color-scheme:dark}
.money{background:none;color:var(--gold);border:0;box-shadow:none;transform:none;text-shadow:2px 2px 0 #000}
.item,.layers button{border:2px solid var(--line);box-shadow:none;border-radius:6px}
.item:not(:disabled):hover{border-color:var(--gold)}
#stage{height:420px;display:block;padding:0;border:3px solid var(--gold);border-radius:10px;box-shadow:0 0 0 3px #000;text-align:left;color:#fff;font-family:'Noto Sans KR',sans-serif;background:radial-gradient(var(--spk,#6b6b73) 2px,transparent 3px) 9px 13px/58px 51px,repeating-conic-gradient(var(--g1,#2d2d30) 0 25%,var(--g2,#343438) 0 50%) 0 0/36px 36px}
#stage::after{content:'';position:absolute;inset:0;background:radial-gradient(transparent 55%,rgba(0,0,0,.6));pointer-events:none;z-index:1}
#stage small{display:none}
#miner,#rock,.deco,#bossc{position:absolute}
#miner{left:6%;top:54%;margin:0;z-index:2}
#rock{left:40%;top:58%;margin:0;width:96px;height:64px;z-index:2}
#arm{transform-origin:62px 58px}
#stage.bad #miner{filter:saturate(.6) brightness(.85)}
#stage.bad #miner::after{content:'💦';position:absolute;right:20px;top:-8px;font-size:22px}
.rhp{position:absolute;left:6px;right:6px;top:-10px;height:6px;background:#400;border:1px solid #000}
.rhp i{display:block;height:100%;background:#e03a3a;transition:width .1s}
.deco{z-index:1;opacity:.9}.d1{left:3%;top:80%}.d2{left:62%;top:32%}.d3{left:44%;top:26%}
#bub{left:8px;top:170px;max-width:130px;z-index:3}
.f{color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;font-size:20px;z-index:3}
.hl{position:absolute;left:6px;top:6px;width:170px;z-index:3;font-size:11px;text-shadow:0 1px 0 #000}
.hl b{display:block;margin-bottom:2px}
.bar{position:relative;height:13px;margin-bottom:3px;background:#000;border:1px solid #fff8;border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;transition:width .4s}
.hp i{background:#e03a3a}.mp i{background:#2f8fe0}
.bar em{position:absolute;inset:0;text-align:center;font-style:normal;font-size:10px;line-height:11px}
#mini{position:absolute;right:6px;top:6px;width:86px;height:86px;border:2px solid var(--gold);background:#12301f;z-index:3;overflow:hidden}
#mini i{position:absolute;width:5px;height:5px;border-radius:50%;background:#e33}
#mini u{position:absolute;left:41px;top:41px;width:7px;height:7px;background:#ffd34d;border-radius:50%;animation:bl 1s infinite alternate}
@keyframes bl{to{opacity:.3}}
#quest{position:absolute;left:6px;top:78px;width:150px;padding:6px 8px;background:rgba(20,50,30,.85);border:2px solid #4a8f5f;border-radius:6px;font-size:11px;z-index:3;line-height:1.35}
#quest b{display:block;color:#9be3ae}#quest span{color:#cde}
#slots{position:absolute;right:6px;bottom:30px;display:grid;grid-template-columns:repeat(2,44px);gap:5px;z-index:3}
.slot{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.65);border:2px solid #666;border-radius:6px;color:#aaa;font-size:18px;line-height:1;cursor:pointer;position:relative}
.slot.ok{border-color:var(--gold);color:#fff}
.slot b{position:absolute;right:3px;top:1px;font-size:9px}
#stage .slot small{display:block;position:static;transform:none;background:none;padding:0;font-size:8px;margin-top:2px;color:#ddd}
#boss{position:absolute;left:8px;right:104px;bottom:6px;z-index:3;min-height:0;margin:0;padding:0;background:none;border:0;box-shadow:none;color:#ff6b5d;font-size:11px;font-weight:700;text-shadow:0 1px 0 #000;pointer-events:none}
#boss::before{content:none}
#bossc{right:-100px;top:120px;z-index:2;transition:right .9s}
#bossc.in{right:100px}
#bbub{position:absolute;bottom:86px;left:50%;transform:translateX(-50%);width:120px;padding:4px 6px;background:#fff;color:#1a1714;border:2px solid #1a1714;border-radius:10px;font-size:11px;font-weight:700;text-align:center}
.rkr{display:flex;gap:8px;align-items:center;padding:6px 8px;border:2px solid var(--line);border-radius:6px;margin-bottom:4px;font-size:13px}
.rkr.me{border-color:var(--gold);background:#3a2f1a}.rkr b{flex:1}.rkr em{font-style:normal;color:var(--sub);font-size:12px}
.nick{display:flex;gap:6px;margin-top:8px}
.nick input{flex:1;min-width:0;padding:8px;border:2px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
.nick button{padding:8px 12px;border:2px solid var(--gold);border-radius:6px;background:var(--hat);color:#2a2622;font:700 14px 'Noto Sans KR',sans-serif;cursor:pointer}
#cine{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:rgba(10,8,6,.88)}
#cine.on{display:flex}
.sheet{position:relative;width:min(80%,280px);padding:18px;background:#f6f1e3;color:#1a1714;border:3px solid #1a1714;animation:sheet 2.8s forwards}
.sheet h3{margin:0 0 8px;font:24px 'Black Han Sans',sans-serif;text-align:center}.sheet p{margin:0;font-size:13px}
@keyframes sheet{0%{transform:translateY(60px) rotate(-8deg);opacity:0}15%{transform:none;opacity:1}70%{transform:none;opacity:1}100%{transform:translate(160px,-420px) rotate(40deg) scale(.4);opacity:0}}
.stamp{position:absolute;right:10px;bottom:10px;width:62px;height:62px;display:flex;align-items:center;justify-content:center;color:#d12;border:4px solid #d12;border-radius:50%;font:20px 'Black Han Sans',sans-serif;animation:stamp .3s .7s both}
@keyframes stamp{from{transform:rotate(-15deg) scale(3);opacity:0}to{transform:rotate(-15deg) scale(1);opacity:1}}
.cg{margin:0;color:var(--hat);font:26px 'Black Han Sans',sans-serif;-webkit-text-stroke:2px #000;paint-order:stroke fill;animation:cgi .4s 1.4s both}
@keyframes cgi{from{opacity:0;transform:scale(.5)}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.stamp,.cg,#mini u{animation:none}#bossc{transition:none}}
#rock{transform-origin:30% 100%}
#rock.boss{transform:scale(1.5);filter:drop-shadow(0 0 8px #f33) hue-rotate(-15deg)}
#rock.boss::before{content:'👑';position:absolute;left:34px;top:-34px;font-size:20px}
#rock.boss.hit{animation:bhit .14s}
@keyframes bhit{50%{transform:scale(1.4,1.42) rotate(-3deg)}}
.dmg{position:absolute;pointer-events:none;z-index:4;font:22px 'Black Han Sans',sans-serif;color:#fff;-webkit-text-stroke:4px #000;paint-order:stroke fill;white-space:nowrap}
.dmg.crit{color:#ffd34d;font-size:32px}
.dmg.auto{font-size:15px;color:#bfe3ff;-webkit-text-stroke:3px #000}
#combo{position:absolute;left:150px;top:100px;z-index:4;font:26px 'Black Han Sans',sans-serif;color:#ffd34d;-webkit-text-stroke:4px #000;paint-order:stroke fill;transform:rotate(-8deg);pointer-events:none;opacity:0;white-space:nowrap}
#combo.on{opacity:1;animation:cpop .15s}
@keyframes cpop{from{transform:rotate(-8deg) scale(1.5)}}
#rock svg{transform-origin:50% 100%;animation:idl 1s ease-in-out infinite alternate}
#rock.hit svg{animation:idl 1s ease-in-out infinite alternate,fl .14s}
@keyframes idl{to{transform:scaleY(.93)}}
@keyframes fl{50%{filter:brightness(2.2)}}
#miner svg{animation:mid 1.1s ease-in-out infinite alternate}
@keyframes mid{to{transform:translateY(-3px)}}
#stage.shk{animation:shkS .25s}
@keyframes shkS{25%{transform:translate(-4px,2px)}75%{transform:translate(4px,-2px)}}
#stage::after{animation:flk 2.4s ease-in-out infinite alternate}
@keyframes flk{to{opacity:.8}}
.drop{position:absolute;z-index:4;font-size:28px;cursor:pointer;filter:drop-shadow(0 0 6px #ffd34d);animation:dr .5s,bobd .8s .5s infinite alternate}
@keyframes dr{from{transform:translateY(-40px) scale(.3);opacity:0}}
@keyframes bobd{to{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){#rock svg,#rock.hit svg,#miner svg,.drop,#combo.on,#stage.shk,#stage::after{animation:none}}
.d1{left:50%;top:86%}
#skills{position:absolute;left:8px;bottom:26px;display:flex;gap:6px;z-index:3}
.sk{position:relative;width:46px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.7);border:2px solid var(--gold);border-radius:8px;font-size:20px;line-height:1;cursor:pointer;color:#fff}
.sk em{font-size:9px;font-style:normal;margin-top:2px}
.sk span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:18px 'Black Han Sans',sans-serif;text-shadow:0 0 4px #000}
.sk.cd{filter:grayscale(1) brightness(.6);border-color:#666;cursor:not-allowed}
#rbub{position:absolute;z-index:3;display:none;max-width:120px;padding:4px 8px;background:#fff;color:#1a1714;border:2px solid #1a1714;border-radius:10px;font:700 11px 'Noto Sans KR',sans-serif;pointer-events:none}
#rbub.on{display:block}
#night{position:absolute;inset:0;background:#050a28;opacity:0;pointer-events:none;z-index:2}
#wx{position:absolute;inset:0;pointer-events:none;z-index:2;display:none}
#wx.rain{display:block;background:repeating-linear-gradient(105deg,transparent 0 6px,rgba(170,200,255,.35) 6px 7px);background-size:40px 40px;animation:rain .35s linear infinite}
@keyframes rain{to{background-position:-12px 40px}}
#wx.heat{display:block;background:radial-gradient(circle at 50% 100%,rgba(255,120,30,.35),transparent 70%);animation:flk 1s ease-in-out infinite alternate}
#wx.fog{display:block;background:linear-gradient(rgba(225,230,240,.35),rgba(225,230,240,.15));animation:flk 3s ease-in-out infinite alternate}
#tod{position:absolute;right:6px;top:96px;z-index:3;padding:2px 6px;background:rgba(0,0,0,.65);border:2px solid var(--gold);border-radius:6px;font-size:10px;line-height:1.3;text-align:right;max-width:130px}
@media (prefers-reduced-motion:reduce){#wx{animation:none!important}}
.cm{display:flex;gap:8px;align-items:center;padding:8px;border:2px solid var(--line);border-radius:6px;background:var(--card);margin-bottom:6px}
.cm .ce{font-size:26px}.cm b{font-size:13px;display:block}.cm .d{font-size:12px;color:var(--sub);display:block}
.cm button{padding:4px 8px;border:2px solid var(--gold);border-radius:6px;background:var(--hat);color:#2a2622;font:700 11px 'Noto Sans KR',sans-serif;cursor:pointer;margin-left:auto}
#syn{margin-top:10px}#syn>b{font-size:13px;display:block;margin-bottom:4px}
#pets{position:absolute;left:6%;top:300px;z-index:2;display:flex;gap:4px;font-size:22px}
#pets span{display:inline-block;animation:bob .6s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){#pets span{animation:none}}
#rk,.nick{display:none}
</style>
</head>
<body>
<main>
  <div class="top"><h1>돈영이 키우기</h1><div class="rank" id="rank"></div></div>
  <p class="money" id="money">0원</p>
  <p class="rate" id="rate"></p>
  <div id="fx"><span id="fxt"></span><button id="fxb"></button></div>
  <button id="stage" aria-label="곡괭이질"><small id="loc"></small><div id="miner">🧑‍🏭⛏️</div><div id="rock"></div></button>
  <div class="layers" id="layers"></div>
  <div id="boss"></div>
  <h2>동료와 장비</h2><div id="gens"></div>
  <h2>곡괭이</h2><div id="ups"></div>
  <h2>퇴사</h2><button class="item" id="quit"></button>
  <h2 id="ah"></h2><div class="ach" id="ach"></div>
  <h2 id="crh"></h2><button class="item" id="pull"></button><div id="crew2"></div><div id="syn"></div>
  <h2>🐾 펫</h2><div id="petl"></div>
  <h2 hidden>🏆 친구 랭킹</h2><div id="rk"></div><div class="nick"><input id="nick" maxlength="10" placeholder="닉네임 (최대 10자)"><button id="nickb">닉네임 변경</button></div>
  <div class="foot"><button id="mute"></button><button id="save">저장</button><button id="reset">처음부터</button></div>
</main>
<div id="toast" role="status"></div>
<script>
var KEY="donyoung-v2";

function draw(){drawCrew();bubble();hud();skillUI();crewUI();
  var l=LAY[S.layer];
  document.getElementById("money").textContent=fmt(S.money)+"원";
  document.getElementById("rate").textContent="초당 "+fmt(perSec())+"원 · 보너스 +"+Math.round((mult()-1)*100)+"%";
  document.getElementById("loc").textContent="현재 지층: "+l.n+" ("+fmt(S.ore[S.layer])+"개 채굴)";
  rock.style.setProperty("--oc",l.c);
  var fx=document.getElementById("fx");
  if(fxOn()){fx.style.display="flex";fx.className=FX.bad?"bad":"good";document.getElementById("fxt").textContent=FX.t+" ("+Math.ceil((FX.until-Date.now())/1000)+"초)";var b=document.getElementById("fxb");b.style.display=FX.cure?"":"none";b.textContent="병원 가기 (-5%)"}else fx.style.display="none";
  GENS.forEach(function(g,i){var c=cost(g.base,S.gens[i]);gB[i].disabled=S.money<c;gB[i].children[1].textContent=fmt(c)+"원";gB[i].children[2].textContent=S.gens[i]});
  UPS.forEach(function(u,i){var c=cost(u.base,S.ups[i]);uB[i].disabled=S.money<c;uB[i].children[1].textContent=fmt(c)+"원";uB[i].children[2].textContent=S.ups[i]});
  LAY.forEach(function(y,i){var b=lB[i];b.className=i==S.layer?"on":"";b.disabled=!S.open[i]&&S.money<y.cost;
    b.innerHTML='<i style="background:'+y.c+'"></i>'+y.n+"<br>×"+fmt(y.v)+(S.open[i]?"":"<br>개방 "+fmt(y.cost)+"원")});
  var g=sevGain(),q=document.getElementById("quit");q.disabled=g<1;
  q.innerHTML=g<1?"<div><b>사직서 쓰기</b><span>이번 회차에 100만 원 이상 벌면 퇴직금을 받을 수 있다.</span></div>":"<div><b>사직서 제출</b><span>퇴직금 "+g+"개 획득 (개당 영구 +10%)</span></div>";
  document.getElementById("rank").innerHTML=RANKS[Math.min(RANKS.length-1,S.quits)]+"<br>누적 "+fmt(S.total)+"원";
  document.getElementById("ah").textContent="업적 "+nAch()+"/"+ACH.length+" (개당 수익 +2%)";
  ACH.forEach(function(a,i){aB[i].className=S.ach[i]?"done":""});
  document.getElementById("mute").textContent=S.mute?"소리 켜기":"소리 끄기";
}
function checkAch(){ACH.forEach(function(a,i){if(!S.ach[i]&&a.f()){S.ach[i]=1;toast("🏆 업적 달성: "+a.n);SFX.ach()}})}

var last=Date.now(),acc=0;
setInterval(function(){
  var now=Date.now(),dt=(now-last)/1000;last=now;
  var p=perSec();earn(p*dt);evTick();checkAch();bossTick();brockTick();
  acc+=dt;if(acc>.7&&p>0&&!document.hidden){acc=0;swingHit(1);dmg(p*.7,false,rock.offsetLeft+20+Math.random()*50,rock.offsetTop-4,1);chips(rock.offsetLeft+60,rock.offsetTop+40,3)}
  draw();
},250);
setInterval(save,15000);
setInterval(function(){say(BOSS[Math.floor(Math.random()*BOSS.length)])},9000);

var had=load();
if(had){var off=Math.min((Date.now()-S.t)/1000,8*3600),gain=perSec()*off;
  if(gain>=1&&off>30){earn(gain);say("자리 비운 "+Math.floor(off/60)+"분 동안 동료들이 "+fmt(gain)+"원어치 캐놨다. 고맙다는 말은 없다.")}}
else say("사장: 돈영이, 첫 출근이군. 곡괭이는 저기 있다.");
if(!S.life)S.life=S.total;
document.getElementById('nick').value=S.name||'';
document.getElementById('nickb').onclick=function(){S.name=document.getElementById('nick').value.trim().slice(0,10);save();if(S.name){rkPush(1);toast('랭킹에 등록했다: '+S.name)}};
rkDraw();rkInit();setInterval(rkPush,10000);document.addEventListener('visibilitychange',function(){if(document.hidden){save();rkPush(1)}});
last=Date.now();draw();
</script>
</body>
</html>
